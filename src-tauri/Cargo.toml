[package]
name = "z-biz-tool-mind"
version = "0.2.0"
description = "思维导图桌面工具 - 对标亿图脑图MindMaster"
authors = ["z-biz-tool"]
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_mind_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", features = [] }
tauri-plugin-clipboard-manager = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
data-encoding = "2"
aes-gcm = "0.10.3"
getrandom = "0.2"
# 能力共享层：协议/鉴权/错误脱敏统一在 cap-llm，mind 不再自建请求代码
cap-llm = { path = "../../z-biz-tool-capability/crates/cap-llm" }

[dev-dependencies]
# 只为真实网关直连用例（live_zbiz_*）提供 #[tokio::test]；
# 不设 ZBIZ_GW 时这些用例直接返回，不发起任何网络请求。
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
