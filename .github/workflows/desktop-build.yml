name: desktop-build

# 为什么要一条流水线：安装包造不出来是物理限制，不是代码问题 ——
# Windows 上没有 hdiutil，出不了 .dmg；macOS 上没有 WiX/NSIS，也出不了 .msi/.exe。
# 所以"可导出 Windows 与 macOS"必须由两台机器完成：
#   windows-latest  → bundle/nsis/*.exe + bundle/msi/*.msi
#   macos-latest    → 两份架构（arm64 给 Apple Silicon，x86_64 给 Intel）的 .dmg + .app
# 两个闸门先跑完：前端（类型检查 + tests/run.mjs 的全部用例 + vite 构建）和 Rust 格式。
# Rust 编译一趟三分钟，没必要为已经红了的前端或一个换行缩进再等一遍。
#
# cargo test 不在 ubuntu 那个闸门里跑，而是在 windows / macOS 两个 job 里各跑一遍：
# Linux 上要 cargo test 就得先 apt 装一整套 GTK/WebKit，装失败的信息看起来还像代码问题；
# 更要紧的是路径判据本身分平台 —— 本机第一轮真跑就撞出 "validate('/proc/self/environ')
# 在 Windows 上被放行" 这种只在某一边才成立的断言，只在 Linux 跑等于没测。

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: 前端闸门（typecheck + 测试 + vite 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/run.mjs
      - run: npm run build

  rust:
    name: Rust 闸门（cargo fmt --check）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Runner 会往 ~/.cargo/config.toml 里塞凭证配置，cargo 认不得这个格式就直接报错退出。
      - run: rm -f "$HOME/.cargo/config.toml"
      - run: cargo fmt --check
        working-directory: src-tauri

  windows:
    name: Windows 安装包（.exe + .msi）
    needs: [web, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      # beforeBuildCommand 会再跑一次 npm run build：前端产物要打进 crate，不能省。
      # 走仓库里同一个入口，本机与 CI 只有"体检由谁做"这一处区别。
      - run: node scripts/build-desktop.mjs --skip-check
      - uses: actions/upload-artifact@v4
        with:
          name: z-biz-tool-mind-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS 安装包（${{ matrix.triple }}）
    needs: [web, rust]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
          - arch: x86_64
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.triple }}
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - run: node scripts/build-desktop.mjs --skip-check --arch=${{ matrix.arch }}
      # .app 是目录，直接 upload 会丢可执行位与 Frameworks 里的符号链接，先打成 tar。
      - name: 打包 .app
        run: tar -czf z-biz-tool-mind-${{ matrix.triple }}.app.tar.gz -C src-tauri/target/${{ matrix.triple }}/release/bundle/macos .
      - uses: actions/upload-artifact@v4
        with:
          name: z-biz-tool-mind-${{ matrix.triple }}
          path: |
            src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            z-biz-tool-mind-${{ matrix.triple }}.app.tar.gz
          if-no-files-found: error
