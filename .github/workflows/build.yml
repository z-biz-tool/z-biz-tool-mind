name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-ARM
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macOS-Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            label: Linux
            args: ""
          - platform: windows-latest
            label: Windows
            args: ""

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add darwin targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Remove runner cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "$USERPROFILE/.cargo/config.toml"

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "z-biz-tool-mind v__VERSION__"
          releaseBody: |
            ## 安装包
            - macOS（Apple Silicon / Intel）：`.dmg`
            - Windows：`.msi` / `.exe`
            - Linux：`.deb` / `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.{dmg,app,deb,AppImage,msi,exe}
            src-tauri/target/*/release/bundle/**/*.{dmg,app}
          if-no-files-found: warn
